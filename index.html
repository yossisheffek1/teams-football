<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כדורגל שבועי ⚽</title>
<meta name="theme-color" content="#11161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כדורגל">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="⚽ הרשמה לכדורגל השבועי">
<meta property="og:description" content="כל הקודם זוכה, נרשמים בלחיצה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c232c; --ink:#e6edf3; --muted:#8b949e; --line:#2b3440;
    --pitch:#11161d; --pitch2:#161b22; --accent:#3ddc84; --accent-ink:#0d1117;
    --wait:#f0b429; --wait-bg:#2a2112; --danger:#ff6b6b; --chip:#21262d;
    color-scheme:dark;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Heebo",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:16px}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}

  header{background:var(--pitch);color:#fff;position:relative;overflow:hidden;padding:22px 18px 18px}
  header::before{content:"";position:absolute;inset:0;background:
     repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);}
  header::after{content:"";position:absolute;width:180px;height:180px;border:2px solid rgba(255,255,255,.12);border-radius:50%;left:-60px;top:-50px}
  .hin{position:relative;max-width:560px;margin:0 auto;z-index:1}
  h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.3px}
  .sub{margin-top:4px;color:rgba(255,255,255,.75);font-size:14px}
  .stats{display:flex;gap:8px;margin-top:14px}
  .stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
  .stat span{font-size:12px;color:rgba(255,255,255,.7)}
  .bar{height:6px;background:rgba(255,255,255,.12);border-radius:6px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:#3ddc84;border-radius:6px;transition:width .3s}

  nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .tabs{display:flex;background:#0a0e13;border-radius:12px;padding:4px;gap:4px}
  .tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
  .tabs button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:14px;margin-top:12px}
  .card h2{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h2 .count{font-weight:600;color:var(--muted);font-size:14px;margin-inline-start:auto}
  .hint{color:var(--muted);font-size:13.5px;line-height:1.5}

  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#0d1117;outline:none}
  .addrow input:focus,textarea:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:11px 16px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn.warn{background:#3a1a1a;color:var(--danger)}
  .btn.full{width:100%;display:block;text-align:center}
  .btn.big{padding:14px 16px;font-size:17px}
  .linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:8px 0}
  textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#0d1117;outline:none;resize:vertical;margin-top:8px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
  .chip:active{background:#2b3440}

  ol.list{list-style:none;margin:0;padding:0}
  .row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .num{width:28px;height:28px;flex:none;border-radius:50%;background:#12301f;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13.5px}
  .wait .num{background:var(--wait-bg);color:var(--wait)}
  .nm{flex:1;min-width:0}
  .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{color:var(--muted);font-size:12px}
  .ctl{display:flex;gap:2px}
  .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .ic:active{background:var(--chip)}
  .ic.x{color:var(--danger);font-size:18px}
  .ic[disabled]{opacity:.25;pointer-events:none}
  .empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14.5px}
  .waitcard{border-color:#4a3a1a;background:#1b1a14}
  .waitcard h2{color:var(--wait)}

  .stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
  .stepper:first-of-type{border-top:0}
  .stepper .lbl b{display:block;font-weight:700}
  .stepper .lbl small{color:var(--muted)}
  .stepper .ctrl{display:flex;align-items:center;gap:6px}
  .stepper .ctrl button{width:40px;height:40px;border-radius:12px;background:var(--chip);font-size:22px;font-weight:700}
  .stepper .ctrl output{min-width:38px;text-align:center;font-size:22px;font-weight:800}

  .teams{display:grid;gap:10px;margin-top:12px}
  .team{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .team .th{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:16px}
  .team .th .sw{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15)}
  .team .th small{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:12.5px}
  .team ul{list-style:none;margin:0;padding:4px 14px 12px;display:flex;flex-wrap:wrap;gap:6px}
  .team li{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:14.5px;font-weight:500}
  .stale{background:var(--wait-bg);color:#f0c36b;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}

  .prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0}
  .prow .nm b{font-weight:600}
  .stars{display:flex;gap:2px;direction:ltr}
  .stars button{width:30px;height:32px;font-size:20px;color:#3a424d;line-height:1}
  .stars button.on{color:#f0b429}

  .share{display:flex;gap:8px;margin-top:12px}
  .share > *{flex:1}
  a.btn{text-decoration:none;text-align:center}
  .wa{background:#25d366;color:#fff}

  .note{background:#14243a;color:#93c5fd;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#e6edf3;color:#0d1117;padding:11px 16px;border-radius:12px;font-size:14.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .copybox{margin-top:10px}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .me{border-width:2px}
  .me.in{border-color:#2f8f5a;background:#12261b}
  .me.waiting{border-color:#f1d29a;background:#221c10}
  .mebig{font-size:21px;font-weight:800}
  .mesub{color:var(--muted);margin-top:4px;font-size:14.5px;line-height:1.5}
  .reg{border:2px solid #2f8f5a}
  .admin{background:#161d2b;border-color:#2b3a55}
  .row.mine{background:#12261b;border-radius:10px}
  .unr{color:var(--muted);font-size:12px;display:block}
  .foot{text-align:center;margin-top:26px}
  .linkbtn.muted{color:var(--muted);font-weight:500;font-size:13px}
  .btn[disabled]{opacity:.6}
  .stars button{width:26px;height:30px;font-size:18px}
  .dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-inline-start:4px;border:1px solid rgba(0,0,0,.18);vertical-align:-2px}
  .crow{padding:8px 0;border-top:1px solid var(--line)}
  .clbl{font-size:14px;margin-bottom:6px}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .swatch{width:27px;height:27px;border-radius:50%;border:2px solid rgba(0,0,0,.14)}
  .swatch.on{outline:3px solid var(--ink);outline-offset:2px}
  .chip.on{background:var(--accent);color:var(--accent-ink)}
  .subsel{margin-top:8px}
  .team li.sub{background:#2a2112;color:#f0c36b}
  .opt{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:12px}
  .opt.mine{border:2px solid var(--accent)}
  .opt .teams{margin-top:8px}
  .opth{display:flex;align-items:center;gap:8px}
  .opth b{font-size:18px;font-weight:800}
  .opth small{color:var(--muted)}
  .vcount{margin-inline-start:auto;background:#12301f;color:var(--accent);font-weight:700;border-radius:20px;padding:3px 10px;font-size:13.5px}
  .vbar{height:6px;background:var(--chip);border-radius:6px;margin-top:8px;overflow:hidden}
  .vbar i{display:block;height:100%;background:var(--accent)}
  .btn.chosen{background:#12301f;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
  .banner{background:#14243a;color:#93c5fd;border-radius:12px;padding:11px 13px;margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.5}
  .banner.voting{background:#2a2112;color:#f0c36b}
  .banner.final{background:#12301f;color:#86efac}
  .votecall{display:block;width:100%;text-align:start;background:#2a2112;border-color:#f1d29a}
  .votecall b{display:block;font-size:17px}
  .votecall span{color:#f0c36b;font-size:14px}
  .imgshare{margin-top:8px}
  .imglinks{display:flex;gap:16px;justify-content:center}
  .preview{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:6px;display:block}
  .tabs button{font-size:14px;padding:9px 2px}
  .gamecard{background:var(--card);border-color:#1f4a32}
  .gline{display:flex;gap:16px;flex-wrap:wrap;font-size:16px}
  .gplace{margin-top:4px;color:var(--ink);font-size:15px}
  .btn.waze{background:#33ccff;color:#06283d}
  .paycard{border-color:#3b2f5a;background:#1a1726}
  .btn.pay{background:#7c3aed;color:#fff;margin-top:6px}
  .paid-ok{background:#12301f;color:var(--accent);font-weight:700;border-radius:12px;padding:10px 12px;text-align:center}
  .ic.pay{filter:grayscale(1);opacity:.45}
  .ic.pay.on{filter:none;opacity:1;background:#2e2810}
  .ic.gk{opacity:.3;font-size:16px}
  .ic.gk.on{opacity:1;background:#12301f}
  .promo{border-color:#2f8f5a;background:#12261b}
  .promoh{display:flex;align-items:center;justify-content:space-between;font-size:16px}
  .install{position:relative;background:#161d2b;border-color:#2b3a55;padding-inline-end:40px}
  .install .close{position:absolute;top:6px;inset-inline-end:6px}
  .countdown{text-align:center;border:2px dashed #1f4a32}
  .cdbig{font-size:38px;font-weight:900;color:var(--accent);margin:6px 0;font-variant-numeric:tabular-nums}
  .stats-t{width:100%;border-collapse:collapse;font-size:14.5px}
  .stats-t th{color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .stats-t td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
  .stats-t .tn{text-align:start;font-weight:600}
  .stats-t tr.top td{background:#2a2410}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .hrow:first-of-type{border-top:0}
  .hdate{color:var(--muted);font-size:13px;min-width:40px}
  .hres{flex:1;font-weight:600}
  .field{display:block;margin-top:10px}
  .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input,.addrow input[type=datetime-local]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#0d1117;outline:none;min-width:0}
  .field input:focus{border-color:var(--accent)}
  .sub-h{font-weight:800;margin-top:14px;margin-bottom:2px;font-size:15px}
  .aprow{display:flex;align-items:center;gap:6px;margin-top:8px}
  .sel{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;background:#0d1117;font:inherit}
  .prow .ic.gk{flex:none}
  .locked{margin-top:12px;background:#21262d;color:#c9d1d9;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
  .guest{margin-top:10px;background:var(--card2);border:1px dashed #1f4a32;border-radius:12px;padding:8px 10px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
  .me .linkbtn{display:block}
  .mvpcall{background:#2a2410;border-color:#6b5a1f}
  .banner.mvp{background:#2a2410;color:#f0c36b;font-size:16px}
  .mvpc{border-color:#6b5a1f;background:#1c1a12}
  .sug{border-color:#2b3a6a;background:#f5f8ff}
  .sugrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .sugrow .btn{padding:8px 12px}
  .stars button{width:22px;font-size:17px}
  .prow .ic{width:28px}
  .prow .nm{min-width:64px}
  .hrow .ic{font-size:15px}
  .ic.x.confirm{width:auto;padding:0 8px;background:#3a1a1a;font-size:13px;font-weight:700}
  .hedit{border:2px solid var(--accent);border-radius:14px;padding:10px 12px;margin:8px 0;background:#12201a}
  .hedit-h{font-weight:800;margin-bottom:4px}
  .hedit .stepper small{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .phone-in{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#0d1117;outline:none;text-align:right}
  .phone-in:focus{border-color:var(--accent)}
  .pushbtn{margin-top:10px}
  .pushon{margin-top:10px;font-size:13.5px;color:var(--accent)}
  .pushask{margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.5}
  .nm.click{cursor:pointer}
  .phedit{background:#161d2b;border-radius:12px;padding:8px 10px;margin:2px 0 8px}
  .phedit input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
  .navrow{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--muted)}
  .navrow a{color:var(--accent);font-weight:600;text-decoration:none}
  .th.pickable{cursor:pointer}
  .pickhint{font-size:12px;font-weight:600;color:var(--accent);background:#12301f;border-radius:12px;padding:2px 8px;margin-inline-start:4px}
  .teampick{padding:4px 14px 10px}
  .team li.swappable{cursor:pointer;user-select:none;transition:transform .1s}
  .team li.swappable:active{transform:scale(.96)}
  .team li.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  .team li.target{outline:1.5px dashed var(--accent);outline-offset:-1px}
  .swaphint{font-size:13px;color:var(--muted);margin-top:10px}
  .swaphint.on{background:#12301f;color:var(--accent);font-weight:600;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:58px;z-index:4}
  .swaphint .linkbtn{padding:0}
  .switch{width:52px;height:30px;border-radius:30px;background:#3a424d;position:relative;flex:none;transition:background .2s}
  .switch i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
  .switch.on{background:var(--accent)}
  .switch.on i{inset-inline-start:25px}
  .timer{text-align:center;padding:18px 14px}
  .tlabel{font-size:20px;font-weight:800}
  .timer.extra .tlabel{color:#fbbf24}
  .timer.ended .tlabel{color:#dc2626;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.35}}
  .tclock{position:relative;width:240px;height:240px;margin:12px auto}
  .tsvg{width:240px;height:240px;transform:rotate(-90deg) scaleY(-1)}
  .tbg{fill:none;stroke:#21262d;stroke-width:12}
  .tfg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .timer.extra .tfg{stroke:#f59e0b}
  .timer.ended .tfg{stroke:#dc2626}
  .tdisp{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:-1px}
  .tdisp.hot{color:#dc2626}
  .tctl{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px}
  .tctl.col{flex-direction:column;align-items:stretch}
  .tctl .btn.ghost{padding:12px 10px}
  .tmain{flex:1;max-width:170px}
  .tbtn{margin-top:6px}
  .tbtn.extra{background:#f59e0b;color:#1f1300}
  .winbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
  .winbtn{border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .winbtn b{font-size:18px}
  .winbtn span{font-size:12.5px;opacity:.85}
  .winbtn:active{transform:scale(.97)}
  .winlinks{display:flex;justify-content:center;gap:18px}
  .regstate b{display:block;font-size:16px}
  .regstate small{color:var(--muted)}
  .seg3{display:flex;gap:6px;margin-top:10px}
  .seg3 .btn{flex:1;padding:10px 4px;font-size:14.5px}
  .seg3 .btn.on{background:var(--accent);color:var(--accent-ink)}
  .prionote{background:#231a3a;color:#c4b5fd;border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:10px;font-weight:600}
  .seg{display:flex;background:#0a0e13;border-radius:12px;padding:4px;gap:4px;margin-top:12px}
  .seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .att-t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  .att-t th{color:var(--muted);font-weight:600;font-size:12px;padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}
  .att-t td{padding:8px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
  .att-t .tn{text-align:start}
  .att-t td small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .dots{display:flex;gap:3px;direction:ltr;justify-content:center}
  .dots i{width:10px;height:10px;border-radius:3px;background:#2b3440}
  .dots i.y{background:#22c55e}
  .dots i.n{background:#3a424d}
  .dots i.na{background:transparent;border:1px dashed #2b3440}
  .tag{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 8px;white-space:nowrap}
  .tag.hi{background:#12301f;color:#86efac}
  .tag.mid{background:#3a2e0a;color:#fcd34d}
  .tag.lo{background:#3a1616;color:#fca5a5}
  .tag.new{background:#1e2547;color:#a5b4fc}
  .paycard.slim{padding:10px 14px}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k==="class") e.className = v;
    else if(k==="style") e.style.cssText = v;
    else if(k==="value") e.value = v;
    else e.setAttribute(k, v===true ? "" : v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const norm = s => String(s||"").trim().replace(/\s+/g," ").toLowerCase();

function fmtTime(ms){
  if(!ms) return "עכשיו";
  const d=new Date(ms);
  return "יום "+["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"][d.getDay()]+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtFull(ms){ const d=new Date(ms); return `יום ${DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth()+1} ב-${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function fmtDate(ms){ const d=new Date(ms); return `${d.getDate()}.${d.getMonth()+1}`; }
function fmtLeft(ms){
  const s=Math.max(0,Math.floor(ms/1000)), d=Math.floor(s/86400), hh=Math.floor(s%86400/3600), mm=Math.floor(s%3600/60), ss=s%60;
  if(d) return `${d} ימים ו-${hh} שעות`;
  if(hh) return `${hh}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
  return `${mm}:${String(ss).padStart(2,"0")}`;
}

}

function colorSlots(k){
  const src = Array.isArray(S.cfg.colors) ? S.cfg.colors : [];
  const out=[], used=new Set();
  for(let i=0;i<k;i++){ const c=src[i]; if(Number.isInteger(c) && c>=0 && c<COLORS.length && !used.has(c)){ out.push(c); used.add(c); } else out.push(null); }
  for(let i=0;i<k;i++) if(out[i]==null){ let c=0; while(used.has(c)) c++; out[i]=c%COLORS.length; used.add(c); }
  return out;
}
const colorOf = i => COLORS[colorSlots(Math.max(i+1, S.cfg.numTeams))[i]];

function optColorSlots(opt){

  const src=Array.isArray(opt&&opt.colors)?opt.colors:[];
  const out=[], used=new Set();

  for(let i=0;i<k;i++) if(out[i]==null){ let c=base[i]; if(used.has(c)){ c=0; while(used.has(c)) c++; } out[i]=c; used.add(c); }
  return out;
}

  if(!d) return null;

function subscribe(){
  onSnapshot(cfgRef, s=>{ S.cfg = s.exists() ? {...DEF_CFG, ...s.data()} : {...DEF_CFG}; S.cfgLoaded=true; detectPromotions(); armOpenTimer(); render(); }, e=>fail(e));

    try{ const c=await getDoc(cfgRef); if(!c.exists()) await setDoc(cfgRef, DEF_CFG); }catch(e){}

// promotion detection (works across visits via localStorage)
function detectPromotions(){
  if(!S.cfgLoaded || !S.signupsLoaded) return;
  const cap=S.cfg.capacity, active=S.signups.slice(0,cap), waiting=S.signups.slice(cap);
  let prev=null; try{ prev=JSON.parse(localStorage.getItem("lastLists")||"null"); }catch(e){}
  if(prev && Array.isArray(prev.waiting)){
    let changed=false;
    active.filter(s=>prev.waiting.includes(s.id)).forEach(s=>{
      if(!S.promoted.some(p=>p.id===s.id)){ S.promoted.push({id:s.id,name:s.name}); changed=true; }
      if(s.id===S.uid && s.uid===S.uid) toast("🎉 התפנה מקום, עלית מההמתנה! אתה משחק");
    });
    const ids=new Set(S.signups.map(s=>s.id));
    const before=S.promoted.length; S.promoted=S.promoted.filter(p=>ids.has(p.id)); if(S.promoted.length!==before) changed=true;
    if(changed) lsSet("promoted",JSON.stringify(S.promoted));
  }
  lsSet("lastLists", JSON.stringify({active:active.map(s=>s.id), waiting:waiting.map(s=>s.id)}));
}

// ---------- teams ----------
function sizesFor(n,k){ const b=Math.floor(n/k), e=n%k; return Array.from({length:k},(_,i)=>b+(i<e?1:0)); }
function balance(players,k,apart){
  k=Math.max(1,Math.min(k,players.length));
  const sizes=sizesFor(players.length,k);
  const desc=(a,b)=>b.r-a.r;
  const allGK=shuffle(players.filter(p=>p.gk)).sort(desc);
  // a keeper counts in the split by his own "split value" (kv), not by his rating
  const gks=allGK.slice(0,k).map(p=>p.kv!=null?{...p,r:p.kv}:p), rest=shuffle(players.filter(p=>!p.gk).concat(allGK.slice(k).map(p=>({...p,gk:false})))).sort(desc);
  const teams=sizes.map(()=>[]);
  shuffle([...Array(k).keys()]).slice(0,gks.length).forEach((t,i)=>teams[t].push(gks[i]));
  let idx=0,fwd=true;
  const step=()=>{ if(fwd){ if(idx===k-1) fwd=false; else idx++; } else { if(idx===0) fwd=true; else idx--; } };
  for(const p of rest){ let g=0; while(teams[idx].length>=sizes[idx] && g++<k*3) step(); teams[idx].push(p); step(); }
  const pairs=(apart||[]).map(x=>[norm(x.a),norm(x.b)]);
  const sum=t=>t.reduce((a,p)=>a+p.r,0);
  const avg=teams.reduce((a,t)=>a+sum(t),0)/players.length;
  const cost=()=>{
    let c=teams.reduce((a,t)=>a+(sum(t)-t.length*avg)**2,0);
    if(pairs.length) for(const t of teams){ const ns=new Set(t.map(p=>norm(p.name))); for(const [a,b] of pairs) if(ns.has(a)&&ns.has(b)) c+=1000; }
    return c;
  };
  let c=cost();
  for(let it=0;it<5000&&k>1;it++){
    const a=Math.floor(Math.random()*k); let b=Math.floor(Math.random()*(k-1)); if(b>=a) b++;
    const i=Math.floor(Math.random()*teams[a].length), j=Math.floor(Math.random()*teams[b].length);
    if(!!teams[a][i].gk !== !!teams[b][j].gk) continue;  // keep one keeper per team
    [teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
    const nc=cost(); if(nc<=c+1e-9) c=nc; else [teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
  }
  return shuffle(teams).map(t=>t.map(p=>p.name).sort((x,y)=>x.localeCompare(y,"he")));
}
function buildOption(main, subs, k){
  const r=new Map(main.concat(subs).map(p=>[p.name,p.gk&&p.kv!=null?p.kv:p.r]));
  const T=balance(main,k,S.apart).map(ps=>({players:ps, subs:[]}));
  const sum=t=>t.players.concat(t.subs).reduce((a,n)=>a+(r.get(n)||DEF_RATING),0);
  subs.slice().sort((a,b)=>b.r-a.r).forEach(p=>{
    let best=0;
    T.forEach((t,i)=>{ const b=T[best]; if(t.subs.length<b.subs.length || (t.subs.length===b.subs.length && sum(t)<sum(b))) best=i; });
    T[best].subs.push(p.name);
  });
  return {teams:T, gks:main.concat(subs).filter(p=>p.gk).map(p=>p.name)};
}
const canon = opt => opt.teams.map(t=>t.players.slice().sort().join("|")).sort().join("||");
const gkValue = name => { const r=rosterOf(name); return r && r.gk && typeof r.kv==="number" ? r.kv : null; };

}

function makeTeams(){
  const cap=S.cfg.capacity, active=S.signups.slice(0,cap);
  if(active.length<2){ toast("צריך לפחות 2 שחקנים ברשימה"); return; }
  if(!S.isOwner) return makeTeamsServer();   // co-organizers don't see ratings: the server balances

  for(let t=0;t<60 && !b;t++){ const c=buildOption(main,subs,k); if(canon(c)!==canon(a)) b=c; }

function computeStats(){
  const m=new Map();
  for(const g of S.history){
    const teams=g.teams||[]; const max=Math.max(0,...teams.map(t=>t.wins||0));
    teams.forEach(t=>{
      const best = max>0 && (t.wins||0)===max;
      (t.players||[]).concat(t.subs||[]).forEach(n=>{
        const k=norm(n); const s=m.get(k)||{name:n, games:0, wins:0, best:0, mvp:0};
        s.name=n; s.games++; s.wins+=(t.wins||0); if(best) s.best++; m.set(k,s);
      });
    });
  }
  for(const g of S.history) if(g.mvp){ const k=norm(g.mvp); const s=m.get(k)||{name:g.mvp, games:0, wins:0, best:0, mvp:0}; s.mvp++; m.set(k,s); }
  return [...m.values()].sort((a,b)=>b.wins-a.wins || b.best-a.best || b.mvp-a.mvp || (b.wins/Math.max(1,b.games))-(a.wins/Math.max(1,a.games)) || a.name.localeCompare(b.name,"he"));
}

function ratingSuggestions(){
  const per=new Map();
  for(const g of S.history){
    const teams=g.teams||[], tot=teams.reduce((a,t)=>a+(t.wins||0),0), k=teams.length; if(!tot||k<2) continue;
    teams.forEach(t=>{ const share=(t.wins||0)/tot*k;
      (t.players||[]).forEach(n=>{ const r=rosterOf(n); if(r && r.since && (g.at||0)<r.since) return;
        const key=norm(n), s=per.get(key)||{name:n,games:0,sum:0}; s.games++; s.sum+=share; per.set(key,s); }); });
  }
  const out=[];
  for(const [key,s] of per){
    if(s.games<3) continue;
    const perf=s.sum/s.games, cur=ratingOf(s.name);
    let to=null; if(perf>=1.35 && cur<RATING_MAX) to=cur+1; else if(perf<=0.65 && cur>1) to=cur-1;
    if(to!=null && !dismissedSug.has(`${key}:${cur}>${to}`)) out.push({key,name:s.name,cur,to,perf,games:s.games});
  }
  return out.sort((a,b)=>Math.abs(b.perf-1)-Math.abs(a.perf-1));
}

// ---------- team image (canvas) ----------
const IMG = {W:1080, PAD:44, GAP:22, HEAD:84, ROW:62, TOP:176};
const readyImgs = new Map(), pendingImgs = new Set();
let fontsReady=null;
function ensureFonts(){
  return fontsReady ||= Promise.all(["900 58px Heebo","800 40px Heebo","600 32px Heebo","500 30px Heebo"].map(f=>document.fonts.load(f))).catch(()=>{});
}
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
function setFont(ctx,w,s){ ctx.font=`${w} ${s}px Heebo, Arial, sans-serif`; }
function fitText(ctx,text,maxW,size,weight){ let s=size; setFont(ctx,weight,s); while(ctx.measureText(text).width>maxW && s>16){ s-=2; setFont(ctx,weight,s); } }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function imgGroups(opt){ const k=opt.teams.length, per=k<=4?k:Math.ceil(k/2), g=[]; for(let i=0;i<k;i+=per) g.push(opt.teams.slice(i,i+per).map((t,j)=>({t,idx:i+j}))); return {per,groups:g}; }
function groupH(g){ return IMG.HEAD + Math.max(1,...g.map(c=>c.t.players.length+(c.t.subs||[]).length))*IMG.ROW + 8; }
function sectionH(sec){ const L=imgGroups(sec.opt); return (sec.label?74:0) + L.groups.reduce((a,g)=>a+groupH(g)+IMG.GAP,0); }
function drawCol(ctx,t,idx,x,y,w,h,gk,c){
  const light=lum(c.c)>0.62;
  ctx.save(); rrect(ctx,x,y,w,h,22); ctx.fillStyle="#fff"; ctx.fill(); ctx.clip();
  ctx.fillStyle=c.c; ctx.fillRect(x,y,w,IMG.HEAD);
  if(c.c==="#ffffff"){ ctx.fillStyle="#e3e8e1"; ctx.fillRect(x,y+IMG.HEAD-3,w,3); }
  ctx.fillStyle=light?"#14201a":"#fff"; ctx.textAlign="center";
  fitText(ctx,c.n,w-20,42,800); ctx.fillText(c.n,x+w/2,y+IMG.HEAD/2+2);
  let ry=y+IMG.HEAD;
  const rows=t.players.map(p=>({p,sub:false})).concat((t.subs||[]).map(p=>({p,sub:true})));
  rows.forEach((r,i)=>{
    ctx.fillStyle=r.sub?"#fff3dc":(i%2?"#f4f7f2":"#fff"); ctx.fillRect(x,ry,w,IMG.ROW);
    ctx.fillStyle=r.sub?"#7a5212":"#14201a";
    const txt=(r.sub?"🔄 ":"")+r.p+(gk.has(norm(r.p))?" 🧤":"");
    fitText(ctx,txt,w-24,32,r.sub?500:600); ctx.fillText(txt,x+w/2,ry+IMG.ROW/2+2);
    ry+=IMG.ROW;
  });
  ctx.restore();
  ctx.strokeStyle="#dfe5dc"; ctx.lineWidth=2; rrect(ctx,x+1,y+1,w-2,h-2,22); ctx.stroke();
}
function buildCanvas(title, sections){
  const {W,PAD,GAP,TOP}=IMG;
  const hasSubs=sections.some(s=>s.opt.teams.some(t=>(t.subs||[]).length));
  const hasGK=sections.some(s=>(s.opt.gks||[]).length);
  const legend=[hasSubs&&"🔄 = מחליף", hasGK&&"🧤 = שוער"].filter(Boolean).join("   ");
  const H=TOP+sections.reduce((a,s)=>a+sectionH(s),0)+(legend?110:70);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d"); ctx.direction="rtl"; ctx.textBaseline="middle";
  ctx.fillStyle="#f2f4ef"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0e3b25"; ctx.fillRect(0,0,W,TOP-34);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; setFont(ctx,900,58); ctx.fillText(title,W/2,62);
  const sub=gameLine() || new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
  ctx.fillStyle="rgba(255,255,255,.78)"; fitText(ctx,sub,W-80,30,500); ctx.fillText(sub,W/2,112);
  let y=TOP;
  for(const sec of sections){
    if(sec.label){ ctx.textAlign="right"; ctx.fillStyle="#14201a"; setFont(ctx,800,46); ctx.fillText(sec.label,W-PAD,y+30); y+=74; }
    const L=imgGroups(sec.opt), n=L.per, colW=(W-2*PAD-(n-1)*GAP)/n, gk=gkSet(sec.opt);
    for(const g of L.groups){ const gh=groupH(g); g.forEach((c,j)=>drawCol(ctx,c.t,c.idx,W-PAD-(j+1)*colW-j*GAP,y,colW,gh,gk,optColor(sec.opt,c.idx))); y+=gh+GAP; }
  }
  ctx.textAlign="center"; ctx.fillStyle="#6b776f"; setFont(ctx,500,26);
  if(legend) ctx.fillText(legend,W/2,H-80);
  ctx.fillText("⚽ כדורגל שבועי",W/2,H-38);
  return cv;
}

function tmStart(phase, quiet){

  if(ms<=0){ tmFinish(); return; }

function tmAdjust(ms){
  if(TM.running){ TM.endAt=Math.max(Date.now()+1000, TM.endAt+ms); }
  else TM.left=Math.max(1000, TM.left+ms);

      const teams=opt.teams.map((t,j)=>({players:t.players, subs:t.subs||[], color:slots[j],
        wins:Math.max(0, (((base.teams||[])[j]||{}).wins||0) + (j===i?delta:0))}));

function recaptchaBox(){

const LOGIN_ERR = {"auth/invalid-phone-number":"מספר הטלפון לא תקין","auth/too-many-requests":"יותר מדי ניסיונות. נסה שוב בעוד כמה דקות","auth/invalid-verification-code":"הקוד לא נכון","auth/code-expired":"הקוד פג תוקף, שלח קוד חדש","auth/operation-not-allowed":"התחברות בטלפון עוד לא הופעלה. דבר עם המארגן","auth/quota-exceeded":"נגמרה מכסת ההודעות להיום. נסה מחר","auth/missing-phone-number":"כתוב מספר טלפון"};
async function sendCode(){
  const ph=normPhone(S.draft.loginPh ?? lsGet("myPhone"));
  if(!ph){ toast("כתוב מספר טלפון תקין"); return; }
  S.login={step:"phone", busy:true}; render();
  try{
    const v=recaptchaBox(), e164="+"+ph, u=auth.currentUser;
    confirmation = (u && u.isAnonymous) ? await linkWithPhoneNumber(u, e164, v) : await signInWithPhoneNumber(auth, e164, v);
    lsSet("myPhone",ph); S.login={step:"code", phone:ph}; render();
    setTimeout(()=>{ const el=document.getElementById("f_code"); if(el) el.focus(); },50);
  }catch(e){
    console.warn("login",e); try{ recaptcha&&recaptcha.clear(); }catch(_){} recaptcha=null;
    S.login={step:"phone"}; toast(LOGIN_ERR[e&&e.code]||"לא הצלחתי לשלוח קוד. נסה שוב"); render();
  }
}
async function confirmCode(){
  const code=String(S.draft.loginCode||"").replace(/\D/g,"");
  if(code.length<6){ toast("כתוב את הקוד בן 6 הספרות"); return; }
  S.login={...S.login, busy:true}; render();
  try{
    try{ await confirmation.confirm(code); }
    catch(e){
      // this phone already has an account (from another browser): enter it
      if(e && e.code==="auth/credential-already-in-use"){ const c=PhoneAuthProvider.credentialFromError(e); await signInWithCredential(auth,c); }
      else throw e;
    }
    delete S.draft.loginCode;
    S.authPhone = auth.currentUser && auth.currentUser.phoneNumber;
    try{ await auth.currentUser.getIdToken(true); }catch(_){}
    const name = await identifyMe();
    if(name){ toast(`✔ מחובר. שלום ${name}!`); setTimeout(()=>location.reload(),900); }
    else { S.login={step:"name"}; render(); }
  }catch(e){ console.warn("confirm",e); S.login={...S.login, busy:false}; toast(LOGIN_ERR[e&&e.code]||"האימות נכשל, נסה שוב"); render(); }
}

// --- teams view ---
function setTeamColor(optIdx, i, ci){
  const T=S.teams; if(!T) return;
  const options=T.options.map((o,j)=>{
    if(j!==optIdx) return o;
    const arr=optColorSlots(o), k=arr.indexOf(ci);
    if(k>=0 && k!==i) arr[k]=arr[i];   // swap so each team keeps a unique color
    arr[i]=ci;
    return {...o, colors:arr};
  });
  S.teams={...T, options}; S.colorPick=null; render();
  run(()=>updateDoc(teamsRef,{options}), `הצבע עודכן ל${COLORS[ci].n} ✔`);
}
function pickPlayer(o,t,kind,idx,name){
  const sel=S.swapSel;
  if(!sel || sel.o!==o){ S.swapSel={o,t,kind,idx,name}; render(); return; }
  if(sel.t===t && sel.kind===kind && sel.idx===idx){ S.swapSel=null; render(); return; }
  if(sel.t===t){ S.swapSel={o,t,kind,idx,name}; render(); return; }   // same team: just change selection
  const T=S.teams;
  const options=T.options.map((op,j)=>{
    if(j!==o) return op;
    const teams=op.teams.map(x=>({...x, players:[...x.players], subs:[...(x.subs||[])]}));
    const A=teams[sel.t][sel.kind==="sub"?"subs":"players"], B=teams[t][kind==="sub"?"subs":"players"];
    [A[sel.idx],B[idx]]=[B[idx],A[sel.idx]];
    return {...op, teams};
  });
  S.teams={...T, options}; S.swapSel=null; render();
  run(()=>updateDoc(teamsRef,{options}), `🔁 ${sel.name} ⇄ ${name}`);
}
function swapHint(o){
  const sel=S.swapSel;
  if(sel && sel.o===o) return h("div",{class:"swaphint on"},`🔁 נבחר: ${sel.name}. עכשיו לחץ על שחקן בקבוצה אחרת להחלפה`,
    h("button",{class:"linkbtn",onclick:()=>{S.swapSel=null;render();}},"ביטול"));
  return h("div",{class:"swaphint"},"💡 להחלפה ידנית: לחץ על שחקן ואז על שחקן בקבוצה אחרת");
}
function teamCard(tm,i,showPow,opt,optIdx){
  const c=optColor(opt,i), gk=gkSet(opt||{});
  const pow=showPow ? tm.players.reduce((a,n)=>a+ratingOf(n),0)/Math.max(1,tm.players.length) : null;
  const nm=p=>gk.has(norm(p))?`${p} 🧤`:p;
  const key=`${optIdx}:${i}`, picking=S.isAdmin && S.colorPick===key, cur=optColorSlots(opt)[i];
  return h("div",{class:"team",style:`border-top:5px solid ${c.c==="#ffffff"?"#d1d5db":c.c}`},
    h("div",{class:"th"+(S.isAdmin?" pickable":""),onclick:S.isAdmin?()=>{ S.colorPick=picking?null:key; render(); }:null},
      h("span",{class:"sw",style:`background:${c.c}`}),c.n,
      S.isAdmin ? h("span",{class:"pickhint"},picking?"סגור":"🎨 שנה צבע") : null,
      h("small",null,`${tm.players.length} שחקנים`+(pow!=null?` · כוח ${pow.toFixed(1)}`:""))),
    picking ? h("div",{class:"swatches teampick"},COLORS.map((col,ci)=>h("button",{class:"swatch"+(ci===cur?" on":""),"aria-label":col.n,title:col.n,style:`background:${col.c}`,onclick:e=>{ e.stopPropagation(); setTeamColor(optIdx,i,ci); }}))) : null,
    h("ul",null,tm.players.map((p,j)=>playerChip(p,j,"player")),
      (tm.subs||[]).map((p,j)=>playerChip(p,j,"sub"))));
  function playerChip(p,j,kind){
    const label=(kind==="sub"?"🔄 ":"")+nm(p);

    return h("li",{class:(kind==="sub"?"sub ":"")+"swappable"+(on?" sel":"")+(target?" target":""),onclick:()=>pickPlayer(optIdx,i,kind,j,p)},label);
  }
}

function splitControls(){

  const k=Math.min(S.cfg.numTeams,Math.max(1,active.length)), sz=sizesFor(active.length,k);

  return h("div",{class:"card"},

    h("button",{class:"linkbtn",onclick:()=>{S.showColors=!S.showColors;render();}},

// attendance from weekly snapshots ("new week") plus evenings in the results table
function attendanceWeeks(){
  const wk=S.weeks.map(w=>({date:w.date||w.at, players:w.players||[]}));
  S.history.forEach(g=>{
    const d=g.date||g.at; if(!g.teams||!g.teams.length) return;
    if(wk.some(w=>Math.abs(w.date-d)<3*86400000)) return;
    wk.push({date:d, players:g.teams.flatMap(t=>(t.players||[]).concat(t.subs||[]))});
  });
  return wk.sort((a,b)=>a.date-b.date);
}
function attendance(){
  const wk=attendanceWeeks(), m=new Map();
  wk.forEach((w,i)=>{ new Set(w.players.map(norm)).forEach(k=>{ const n=w.players.find(p=>norm(p)===k);
    const a=m.get(k)||{name:n, first:i, came:[]}; a.came.push(i); m.set(k,a); }); });
  const lates=new Map(); S.lates.forEach(x=>lates.set(norm(x.n),(lates.get(norm(x.n))||0)+1));
  return [...m.values()].map(a=>{
    const weeks=wk.length-a.first, attended=a.came.length, pct=Math.round(attended/weeks*100);
    const set=new Set(a.came), recent=[]; for(let i=Math.max(0,wk.length-8);i<wk.length;i++) recent.push(i<a.first?null:set.has(i));
    let streak=0; for(let i=wk.length-1;i>=a.first && set.has(i);i--) streak++;
    let missRun=0; for(let i=wk.length-1;i>=a.first && !set.has(i);i--) missRun++;
    const label = weeks<2 ? {t:"חדש",c:"new"} : pct>=80 ? {t:"קבוע",c:"hi"} : pct>=50 ? {t:"לפעמים",c:"mid"} : {t:"נדיר",c:"lo"};
    return {name:a.name, weeks, attended, pct, recent, streak, missRun, late:lates.get(norm(a.name))||0, label};
  }).sort((x,y)=>y.pct-x.pct || y.attended-x.attended || x.name.localeCompare(y.name,"he"));
}

    S.prioEdit && (c.hiddenNames||[]).length ? h("div",null,
      h("div",{class:"sub-h"},"מוסתרים (לחץ להחזיר)"),
      h("div",{class:"chips"},(c.hiddenNames||[]).map(k=>h("button",{class:"chip",onclick:()=>setCfg({hiddenNames:(c.hiddenNames||[]).filter(x=>x!==k)},"השם הוחזר")},"↩ "+k)))) : null,
    att.length ? h("button",{class:"linkbtn",onclick:()=>{ const top=att.filter(a=>a.weeks>=3&&a.pct>=75).map(a=>norm(a.name)); if(!top.length){ toast("אין עדיין מספיק נתוני נוכחות"); return; } setCfg({priority:[...new Set([...(c.priority||[]),...top])]},`סומנו ${top.length} שחקנים עם 75%+ נוכחות`); }},"✨ סמן אוטומטית את מי שמגיע 75%+ מהשבועות") : null);
}
const toLocalInput=ms=>{ const t=new Date(ms-new Date(ms).getTimezoneOffset()*60000); return t.toISOString().slice(0,16); };
function settingsCards(){
  const c=S.cfg, k=c.numTeams, cap=c.capacity, per=[...new Set(sizesFor(cap,k))].sort((a,b)=>b-a).join(" / ");
  const g=game(), d=S.draft;
  const field=(key,label,cur,attrs={})=>h("label",{class:"field"},h("span",null,label),
    h("input",{id:"f_"+key,type:attrs.type||"text",value:d[key]??cur??"",placeholder:attrs.ph||"",inputmode:attrs.im||null,dir:attrs.dir||null,oninput:e=>{d[key]=e.target.value;}}));
  const stepper=(lbl,sub,v,min,max,key)=>h("div",{class:"stepper"},
    h("div",{class:"lbl"},h("b",null,lbl),h("small",null,sub)),
    h("div",{class:"ctrl"},
      h("button",{onclick:()=>v>min&&setCfg({[key]:v-1})},"−"),
      h("output",null,v),
      h("button",{onclick:()=>v<max&&setCfg({[key]:v+1})},"+")));
  const open=isOpen(), future=c.openAt && c.openAt>Date.now();

  return [
    h("div",{class:"card"},
      h("h2",null,"🔓 הרשמה"),
      (()=>{ const prio=isPrioOpen(), pa=prioAt();
        const st = open ? "פתוחה לכולם" : prio ? "🎟️ פתוחה לקבועים בלבד" : "סגורה";
        const sub = open ? "כולם יכולים להירשם עכשיו" : prio ? (future?`לכולם: ${fmtFull(c.openAt)}`:"רק מי שברשימת הקבועים יכול להירשם")
          : future ? (pa&&pa>Date.now()?`לקבועים: ${fmtFull(pa)} · לכולם: ${fmtFull(c.openAt)}`:`תיפתח אוטומטית ${fmtFull(c.openAt)}`) : "אף אחד לא יכול להירשם";
        return h("div",null,
          h("div",{class:"regstate"},h("b",null,`ההרשמה ${st}`),h("small",null,sub)),
          h("div",{class:"seg3"},
            h("button",{class:"btn "+(!open&&!prio?"on":"ghost"),onclick:()=>setCfg({open:false,prioOpen:false,openAt:null})},"🔒 סגור"),
            h("button",{class:"btn "+(prio?"on":"ghost"),onclick:()=>{ if(!(c.priority||[]).length){ toast("קודם בחר קבועים בכרטיס ״עדיפות לקבועים״"); return; } setCfg({open:false,prioOpen:true,openAt:null},"🎟️ פתוח לקבועים בלבד"); }},"🎟️ קבועים"),
            h("button",{class:"btn "+(open?"on":"ghost"),onclick:()=>setCfg({open:true,prioOpen:false,openAt:null},"🔓 פתוח לכולם")},"🔓 כולם"))); })(),
      h("div",{class:"sub-h"},"⏰ פתיחה אוטומטית"),
      h("div",{class:"hint"},"ההרשמה תיפתח לבד בזמן שתבחר. כשלוחצים ״פתח רשימה חדשה״ היא מתוזמנת אוטומטית לאותה שעה בשבוע הבא."),
      h("div",{class:"addrow",style:"margin-top:8px"},
        h("input",{id:"f_openAt",type:"datetime-local",value:d.openAt ?? (future?toLocalInput(c.openAt):""),oninput:e=>{d.openAt=e.target.value;}}),
        h("button",{class:"btn",onclick:setAutoOpen},"קבע")),
      future ? h("button",{class:"linkbtn",onclick:()=>setCfg({openAt:null},"הפתיחה האוטומטית בוטלה")},"בטל פתיחה אוטומטית") : null),
    contactsCard(),
    prioCard(),
    S.isOwner ? adminsCard() : null,
    S.isOwner ? surveyAdminCard() : null,
    loginSettingsCard(),
    S.isOwner ? pushPeopleCard() : null,
    S.isOwner ? pushLogCard() : null,
    apartCard(),
    h("div",{class:"card"},
      h("h2",null,"📍 פרטי המשחק"),
      h("div",{class:"hint"},"יופיעו לכולם בראש הדף, וכפתורי הניווט בתחתית הרשימה."),
      field("gameAt","מועד המשחק הקרוב",c.gameAt?toLocalInput(c.gameAt):"",{type:"datetime-local"}),
      h("div",{class:"hint",style:"margin-top:4px"},"בלחיצה על ״פתח רשימה חדשה״ המועד עובר לשבוע הבא אוטומטית."),
      field("gPlace","מקום",g.place,{ph:"למשל: מגרש בית ספר אורט, חולון"}),
      h("button",{class:"btn full",style:"margin-top:10px",onclick:saveDetails},"💾 שמור פרטים")),
    h("div",{class:"card"},
      h("h2",null,"🔔 התראות לשחקנים"),
      pushModeCard()),
    h("div",{class:"card"},
      h("h2",null,"🔒 ביטולים ואורחים"),
      h("div",{class:"hint"}, c.gameAt ? "כמה שעות לפני המשחק שחקנים כבר לא יכולים לבטל לבד?" : "כדי לחסום ביטולים, קבע קודם מועד משחק בכרטיס ״פרטי המשחק״."),
      h("div",{class:"chips"},[0,2,4,6,12,24].map(x=>h("button",{class:"chip"+((c.lockHours||0)===x?" on":""),onclick:()=>setCfg({lockHours:x})},x?`${x} שעות`:"בלי חסימה"))),
      h("div",{class:"stepper",style:"margin-top:8px"},
        h("div",{class:"lbl"},h("b",null,"אורחים (+1)"),h("small",null,c.allowGuests===false?"שחקנים לא יכולים להוסיף אורח":"כל שחקן רשום יכול להוסיף אורח אחד")),
        h("button",{class:"btn "+(c.allowGuests===false?"":"ghost"),onclick:()=>setCfg({allowGuests:c.allowGuests===false})},c.allowGuests===false?"אפשר":"בטל"))),
    h("div",{class:"card"},
      h("h2",null,"⚙️ הגדרות המשחק"),
      stepper("כמות שחקנים","מי שמעבר לזה נכנס להמתנה",cap,2,60,"capacity"),
      stepper("כמות קבוצות",`${per} שחקנים בקבוצה`,k,2,8,"numTeams"),
      h("div",{class:"chips"},[[18,3],[12,2],[15,3],[20,4]].map(([a,b])=>h("button",{class:"chip",onclick:()=>setCfg({capacity:a,numTeams:b})},`${a} · ${b} קבוצות`)))),
    h("div",{class:"card"},
      h("h2",null,"🗓️ שבוע חדש"),
      h("div",{class:"hint"},"מוחק את הנרשמים, הכוחות, ההצבעות והתשלומים. הדירוגים, הטבלה והפרטים נשמרים."),
      h("button",{class:"btn warn full",style:"margin-top:12px",onclick:()=>{
        if(!S.confirmReset){ S.confirmReset=true; render(); setTimeout(()=>{S.confirmReset=false;render();},4000); return; }
        S.confirmReset=false; S.tab="list"; newWeek(); render();
      }},S.confirmReset?"בטוח? לחץ שוב לאישור":"פתח רשימה חדשה"))
  ];
}

window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(t==="teams"||t==="stats"){ S.tab=t; render(); } if(t==="survey"){ S.tab="list"; S.surveyOpenUI=true; render(); } });
if(location.hash==="#survey"){ S.surveyOpenUI=true; }
render();

</script>
