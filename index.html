<style>
  :root{
    --bg:#f2f4ef; --card:#ffffff; --ink:#14201a; --muted:#6b776f; --line:#e3e8e1;
    --pitch:#0e3b25; --pitch2:#145233; --accent:#1f8a4c; --accent-ink:#ffffff;
    --wait:#b7791f; --wait-bg:#fff6e6; --danger:#c0392b; --chip:#eef3ec;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Heebo",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:16px}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}

  header{background:var(--pitch);color:#fff;position:relative;overflow:hidden;padding:22px 18px 18px}
  header::before{content:"";position:absolute;inset:0;background:
     repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);}
  header::after{content:"";position:absolute;width:180px;height:180px;border:2px solid rgba(255,255,255,.12);border-radius:50%;left:-60px;top:-50px}
  .hin{position:relative;max-width:560px;margin:0 auto;z-index:1}
  h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.3px}
  .sub{margin-top:4px;color:rgba(255,255,255,.75);font-size:14px}
  .stats{display:flex;gap:8px;margin-top:14px}
  .stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
  .stat span{font-size:12px;color:rgba(255,255,255,.7)}
  .bar{height:6px;background:rgba(255,255,255,.12);border-radius:6px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:#4ade80;border-radius:6px;transition:width .3s}

  nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .tabs{display:flex;background:#e2e8df;border-radius:12px;padding:4px;gap:4px}
  .tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:14px;margin-top:12px}
  .card h2{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h2 .count{font-weight:600;color:var(--muted);font-size:14px;margin-inline-start:auto}
  .hint{color:var(--muted);font-size:13.5px;line-height:1.5}

  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fafbf9;outline:none}
  .addrow input:focus,textarea:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:11px 16px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn.warn{background:#fdecea;color:var(--danger)}
  .btn.full{width:100%;display:block;text-align:center}
  .btn.big{padding:14px 16px;font-size:17px}
  .linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:8px 0}
  textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbf9;outline:none;resize:vertical;margin-top:8px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
  .chip:active{background:#dfe9dc}

  ol.list{list-style:none;margin:0;padding:0}
  .row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .num{width:28px;height:28px;flex:none;border-radius:50%;background:#e7f3ea;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13.5px}
  .wait .num{background:var(--wait-bg);color:var(--wait)}
  .nm{flex:1;min-width:0}
  .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{color:var(--muted);font-size:12px}
  .ctl{display:flex;gap:2px}
  .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .ic:active{background:var(--chip)}
  .ic.x{color:var(--danger);font-size:18px}
  .ic[disabled]{opacity:.25;pointer-events:none}
  .empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14.5px}
  .waitcard{border-color:#f1dfbd;background:#fffdf8}
  .waitcard h2{color:var(--wait)}

  .stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
  .stepper:first-of-type{border-top:0}
  .stepper .lbl b{display:block;font-weight:700}
  .stepper .lbl small{color:var(--muted)}
  .stepper .ctrl{display:flex;align-items:center;gap:6px}
  .stepper .ctrl button{width:40px;height:40px;border-radius:12px;background:var(--chip);font-size:22px;font-weight:700}
  .stepper .ctrl output{min-width:38px;text-align:center;font-size:22px;font-weight:800}

  .teams{display:grid;gap:10px;margin-top:12px}
  .team{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .team .th{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:16px}
  .team .th .sw{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15)}
  .team .th small{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:12.5px}
  .team ul{list-style:none;margin:0;padding:4px 14px 12px;display:flex;flex-wrap:wrap;gap:6px}
  .team li{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:14.5px;font-weight:500}
  .stale{background:var(--wait-bg);color:#7a5212;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}

  .prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0}
  .prow .nm b{font-weight:600}
  .stars{display:flex;gap:2px;direction:ltr}
  .stars button{width:30px;height:32px;font-size:20px;color:#d5dcd2;line-height:1}
  .stars button.on{color:#f0b429}

  .share{display:flex;gap:8px;margin-top:12px}
  .share > *{flex:1}
  a.btn{text-decoration:none;text-align:center}
  .wa{background:#25d366;color:#fff}

  .note{background:#eef6ff;color:#1d4f86;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#14201a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .copybox{margin-top:10px}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .me{border-width:2px}
  .me.in{border-color:#86d19f;background:#f3fbf5}
  .me.waiting{border-color:#f1d29a;background:#fffaf0}
  .mebig{font-size:21px;font-weight:800}
  .mesub{color:var(--muted);margin-top:4px;font-size:14.5px;line-height:1.5}
  .reg{border:2px solid #86d19f}
  .admin{background:#f7f9ff;border-color:#dbe3f5}
  .row.mine{background:#f3fbf5;border-radius:10px}
  .unr{color:var(--muted);font-size:12px;display:block}
  .foot{text-align:center;margin-top:26px}
  .linkbtn.muted{color:var(--muted);font-weight:500;font-size:13px}
  .btn[disabled]{opacity:.6}
  .stars button{width:26px;height:30px;font-size:18px}
  .dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-inline-start:4px;border:1px solid rgba(0,0,0,.18);vertical-align:-2px}
  .crow{padding:8px 0;border-top:1px solid var(--line)}
  .clbl{font-size:14px;margin-bottom:6px}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .swatch{width:27px;height:27px;border-radius:50%;border:2px solid rgba(0,0,0,.14)}
  .swatch.on{outline:3px solid var(--ink);outline-offset:2px}
  .chip.on{background:var(--accent);color:#fff}
  .subsel{margin-top:8px}
  .team li.sub{background:#fff6e6;color:#7a5212}
  .opt{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:12px}
  .opt.mine{border:2px solid var(--accent)}
  .opt .teams{margin-top:8px}
  .opth{display:flex;align-items:center;gap:8px}
  .opth b{font-size:18px;font-weight:800}
  .opth small{color:var(--muted)}
  .vcount{margin-inline-start:auto;background:#e7f3ea;color:var(--accent);font-weight:700;border-radius:20px;padding:3px 10px;font-size:13.5px}
  .vbar{height:6px;background:var(--chip);border-radius:6px;margin-top:8px;overflow:hidden}
  .vbar i{display:block;height:100%;background:var(--accent)}
  .btn.chosen{background:#e7f3ea;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
  .banner{background:#eef6ff;color:#1d4f86;border-radius:12px;padding:11px 13px;margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.5}
  .banner.voting{background:#fff6e6;color:#7a5212}
  .banner.final{background:#e7f3ea;color:#145233}
  .votecall{display:block;width:100%;text-align:start;background:#fff6e6;border-color:#f1d29a}
  .votecall b{display:block;font-size:17px}
  .votecall span{color:#7a5212;font-size:14px}
  .imgshare{margin-top:8px}
  .imglinks{display:flex;gap:16px;justify-content:center}
  .preview{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:6px;display:block}
  .tabs button{font-size:14px;padding:9px 2px}
  .gamecard{background:linear-gradient(180deg,#f3fbf5,#fff);border-color:#cfe8d6}
  .gline{display:flex;gap:16px;flex-wrap:wrap;font-size:16px}
  .gplace{margin-top:4px;color:var(--ink);font-size:15px}
  .btn.waze{background:#33ccff;color:#06283d}
  .paycard{border-color:#e6dcf7;background:#fbf9ff}
  .btn.pay{background:#7c3aed;color:#fff;margin-top:6px}
  .paid-ok{background:#e7f3ea;color:var(--accent);font-weight:700;border-radius:12px;padding:10px 12px;text-align:center}
  .ic.pay{filter:grayscale(1);opacity:.45}
  .ic.pay.on{filter:none;opacity:1;background:#fdf6d8}
  .ic.gk{opacity:.3;font-size:16px}
  .ic.gk.on{opacity:1;background:#e7f3ea}
  .promo{border-color:#86d19f;background:#f3fbf5}
  .promoh{display:flex;align-items:center;justify-content:space-between;font-size:16px}
  .install{position:relative;background:#f7f9ff;border-color:#dbe3f5;padding-inline-end:40px}
  .install .close{position:absolute;top:6px;inset-inline-end:6px}
  .countdown{text-align:center;border:2px dashed #cfe8d6}
  .cdbig{font-size:38px;font-weight:900;color:var(--accent);margin:6px 0;font-variant-numeric:tabular-nums}
  .stats-t{width:100%;border-collapse:collapse;font-size:14.5px}
  .stats-t th{color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .stats-t td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
  .stats-t .tn{text-align:start;font-weight:600}
  .stats-t tr.top td{background:#fffbeb}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .hrow:first-of-type{border-top:0}
  .hdate{color:var(--muted);font-size:13px;min-width:40px}
  .hres{flex:1;font-weight:600}
  .field{display:block;margin-top:10px}
  .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input,.addrow input[type=datetime-local]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbf9;outline:none;min-width:0}
  .field input:focus{border-color:var(--accent)}
  .sub-h{font-weight:800;margin-top:14px;margin-bottom:2px;font-size:15px}
  .aprow{display:flex;align-items:center;gap:6px;margin-top:8px}
  .sel{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;background:#fafbf9;font:inherit}
  .prow .ic.gk{flex:none}
  .locked{margin-top:12px;background:#f3f4f6;color:#374151;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
  .guest{margin-top:10px;background:#fff;border:1px dashed #cfe8d6;border-radius:12px;padding:8px 10px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
  .me .linkbtn{display:block}
  .mvpcall{background:#fffbeb;border-color:#f6d77a}
  .banner.mvp{background:#fffbeb;color:#7a5212;font-size:16px}
  .mvpc{border-color:#f6d77a;background:#fffdf5}
  .sug{border-color:#c7d7fe;background:#f5f8ff}
  .sugrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .sugrow .btn{padding:8px 12px}
  .stars button{width:22px;font-size:17px}
  .prow .ic{width:28px}
  .prow .nm{min-width:64px}
  .hrow .ic{font-size:15px}
  .ic.x.confirm{width:auto;padding:0 8px;background:#fdecea;font-size:13px;font-weight:700}
  .hedit{border:2px solid var(--accent);border-radius:14px;padding:10px 12px;margin:8px 0;background:#f8fcf9}
  .hedit-h{font-weight:800;margin-bottom:4px}
  .hedit .stepper small{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .phone-in{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbf9;outline:none;text-align:right}
  .phone-in:focus{border-color:var(--accent)}
  .pushbtn{margin-top:10px}
  .pushon{margin-top:10px;font-size:13.5px;color:var(--accent)}
  .pushask{margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.5}
  .nm.click{cursor:pointer}
  .phedit{background:#f7f9ff;border-radius:12px;padding:8px 10px;margin:2px 0 8px}
  .phedit input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
  .navrow{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--muted)}
  .navrow a{color:var(--accent);font-weight:600;text-decoration:none}
  .th.pickable{cursor:pointer}
  .pickhint{font-size:12px;font-weight:600;color:var(--accent);background:#e7f3ea;border-radius:12px;padding:2px 8px;margin-inline-start:4px}
  .teampick{padding:4px 14px 10px}
  .team li.swappable{cursor:pointer;user-select:none;transition:transform .1s}
  .team li.swappable:active{transform:scale(.96)}
  .team li.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
  .team li.target{outline:1.5px dashed var(--accent);outline-offset:-1px}
  .swaphint{font-size:13px;color:var(--muted);margin-top:10px}
  .swaphint.on{background:#e7f3ea;color:var(--accent);font-weight:600;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:58px;z-index:4}
  .swaphint .linkbtn{padding:0}
</style>
</head>

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2), v);

function colorSlots(k){
  const src = Array.isArray(S.cfg.colors) ? S.cfg.colors : [];
  const out=[], used=new Set();
  for(let i=0;i<k;i++){ const c=src[i]; if(Number.isInteger(c) && c>=0 && c<COLORS.length && !used.has(c)){ out.push(c); used.add(c); } else out.push(null); }
  for(let i=0;i<k;i++) if(out[i]==null){ let c=0; while(used.has(c)) c++; out[i]=c%COLORS.length; used.add(c); }
  return out;
}

function optColorSlots(opt){
  const k=(opt&&opt.teams||[]).length, base=colorSlots(Math.max(k,S.cfg.numTeams)).slice(0,k);
  const src=Array.isArray(opt&&opt.colors)?opt.colors:[];
  const out=[], used=new Set();

  for(let i=0;i<k;i++) if(out[i]==null){ let c=base[i]; if(used.has(c)){ c=0; while(used.has(c)) c++; } out[i]=c; used.add(c); }
  return out;
}

function detectPromotions(){
  if(!S.cfgLoaded || !S.signupsLoaded) return;
  const cap=S.cfg.capacity, active=S.signups.slice(0,cap), waiting=S.signups.slice(cap);
  let prev=null; try{ prev=JSON.parse(localStorage.getItem("lastLists")||"null"); }catch(e){}
  if(prev && Array.isArray(prev.waiting)){
    let changed=false;
    active.filter(s=>prev.waiting.includes(s.id)).forEach(s=>{
      if(!S.promoted.some(p=>p.id===s.id)){ S.promoted.push({id:s.id,name:s.name}); changed=true; }
      if(s.id===S.uid && s.uid===S.uid) toast("🎉 התפנה מקום, עלית מההמתנה! אתה משחק");
    });
    const ids=new Set(S.signups.map(s=>s.id));
    const before=S.promoted.length; S.promoted=S.promoted.filter(p=>ids.has(p.id)); if(S.promoted.length!==before) changed=true;
    if(changed) lsSet("promoted",JSON.stringify(S.promoted));
  }
  lsSet("lastLists", JSON.stringify({active:active.map(s=>s.id), waiting:waiting.map(s=>s.id)}));
}

// ---------- teams ----------
function sizesFor(n,k){ const b=Math.floor(n/k), e=n%k; return Array.from({length:k},(_,i)=>b+(i<e?1:0)); }
function balance(players,k,apart){
  k=Math.max(1,Math.min(k,players.length));
  const sizes=sizesFor(players.length,k);
  const desc=(a,b)=>b.r-a.r;
  const allGK=shuffle(players.filter(p=>p.gk)).sort(desc);
  const gks=allGK.slice(0,k), rest=shuffle(players.filter(p=>!p.gk).concat(allGK.slice(k).map(p=>({...p,gk:false})))).sort(desc);
  const teams=sizes.map(()=>[]);
  shuffle([...Array(k).keys()]).slice(0,gks.length).forEach((t,i)=>teams[t].push(gks[i]));
  let idx=0,fwd=true;
  const step=()=>{ if(fwd){ if(idx===k-1) fwd=false; else idx++; } else { if(idx===0) fwd=true; else idx--; } };
  for(const p of rest){ let g=0; while(teams[idx].length>=sizes[idx] && g++<k*3) step(); teams[idx].push(p); step(); }
  const pairs=(apart||[]).map(x=>[norm(x.a),norm(x.b)]);
  const avg=players.reduce((a,p)=>a+p.r,0)/players.length;
  const sum=t=>t.reduce((a,p)=>a+p.r,0);
  const cost=()=>{
    let c=teams.reduce((a,t)=>a+(sum(t)-t.length*avg)**2,0);
    if(pairs.length) for(const t of teams){ const ns=new Set(t.map(p=>norm(p.name))); for(const [a,b] of pairs) if(ns.has(a)&&ns.has(b)) c+=1000; }
    return c;
  };
  let c=cost();
  for(let it=0;it<5000&&k>1;it++){
    const a=Math.floor(Math.random()*k); let b=Math.floor(Math.random()*(k-1)); if(b>=a) b++;
    const i=Math.floor(Math.random()*teams[a].length), j=Math.floor(Math.random()*teams[b].length);
    if(!!teams[a][i].gk !== !!teams[b][j].gk) continue;  // keep one keeper per team
    [teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
    const nc=cost(); if(nc<=c+1e-9) c=nc; else [teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
  }
  return shuffle(teams).map(t=>t.map(p=>p.name).sort((x,y)=>x.localeCompare(y,"he")));
}
function buildOption(main, subs, k){
  const r=new Map(main.concat(subs).map(p=>[p.name,p.r]));
  const T=balance(main,k,S.apart).map(ps=>({players:ps, subs:[]}));
  const sum=t=>t.players.concat(t.subs).reduce((a,n)=>a+(r.get(n)||DEF_RATING),0);
  subs.slice().sort((a,b)=>b.r-a.r).forEach(p=>{
    let best=0;
    T.forEach((t,i)=>{ const b=T[best]; if(t.subs.length<b.subs.length || (t.subs.length===b.subs.length && sum(t)<sum(b))) best=i; });
    T[best].subs.push(p.name);
  });
  return {teams:T, gks:main.concat(subs).filter(p=>p.gk).map(p=>p.name)};
}
const canon = opt => opt.teams.map(t=>t.players.slice().sort().join("|")).sort().join("||");
const player = s => ({name:s.name, r:ratingOf(s.name), gk:isGK(s.name)});
function apartViolations(opt){
  let v=0; for(const t of opt.teams){ const ns=new Set(t.players.map(norm)); for(const p of S.apart) if(ns.has(norm(p.a))&&ns.has(norm(p.b))) v++; } return v;
}
function makeTeams(){
  const cap=S.cfg.capacity, active=S.signups.slice(0,cap);
  if(active.length<2){ toast("צריך לפחות 2 שחקנים ברשימה"); return; }
  const k=Math.min(S.cfg.numTeams,active.length);
  const main=active.map(player);
  const subs=S.signups.slice(cap).filter(s=>S.subSel.has(s.id)).map(player);
  const a=buildOption(main,subs,k); let b=null;
  for(let t=0;t<60 && !b;t++){ const c=buildOption(main,subs,k); if(canon(c)!==canon(a)) b=c; }
  const t={at:Date.now(), options:b?[a,b]:[a], status:"draft", chosen:null};
  S.teams=t; S.resDraft=null; render();
  const bad=apartViolations(a)+(b?apartViolations(b):0);
  run(()=>setDoc(teamsRef,t), bad ? "⚠️ לא הצלחתי להפריד את כל הזוגות של ״לא ביחד״" : (b?"נוצרו 2 אופציות ⚽":"נוצרה אופציה אחת (אין מספיק שחקנים לשתיים)"));
}

function optionStrength(opt){

}

function computeStats(){
  const m=new Map();
  for(const g of S.history){
    const teams=g.teams||[]; const max=Math.max(0,...teams.map(t=>t.wins||0));
    teams.forEach(t=>{
      const best = max>0 && (t.wins||0)===max;
      (t.players||[]).concat(t.subs||[]).forEach(n=>{
        const k=norm(n); const s=m.get(k)||{name:n, games:0, wins:0, best:0, mvp:0};
        s.name=n; s.games++; s.wins+=(t.wins||0); if(best) s.best++; m.set(k,s);
      });
    });
  }
  for(const g of S.history) if(g.mvp){ const k=norm(g.mvp); const s=m.get(k)||{name:g.mvp, games:0, wins:0, best:0, mvp:0}; s.mvp++; m.set(k,s); }
  return [...m.values()].sort((a,b)=>b.wins-a.wins || b.best-a.best || b.mvp-a.mvp || (b.wins/Math.max(1,b.games))-(a.wins/Math.max(1,a.games)) || a.name.localeCompare(b.name,"he"));
}

function ratingSuggestions(){
  const per=new Map();
  for(const g of S.history){
    const teams=g.teams||[], tot=teams.reduce((a,t)=>a+(t.wins||0),0), k=teams.length; if(!tot||k<2) continue;
    teams.forEach(t=>{ const share=(t.wins||0)/tot*k;
      (t.players||[]).forEach(n=>{ const r=rosterOf(n); if(r && r.since && (g.at||0)<r.since) return;
        const key=norm(n), s=per.get(key)||{name:n,games:0,sum:0}; s.games++; s.sum+=share; per.set(key,s); }); });
  }
  const out=[];
  for(const [key,s] of per){
    if(s.games<3) continue;
    const perf=s.sum/s.games, cur=ratingOf(s.name);
    let to=null; if(perf>=1.35 && cur<RATING_MAX) to=cur+1; else if(perf<=0.65 && cur>1) to=cur-1;
    if(to!=null && !dismissedSug.has(`${key}:${cur}>${to}`)) out.push({key,name:s.name,cur,to,perf,games:s.games});
  }
  return out.sort((a,b)=>Math.abs(b.perf-1)-Math.abs(a.perf-1));
}
function dismissSug(s){ dismissedSug.add(`${s.key}:${s.cur}>${s.to}`); lsSet("dismissedSug",JSON.stringify([...dismissedSug])); render(); }

// ---------- team image (canvas) ----------
const IMG = {W:1080, PAD:44, GAP:22, HEAD:84, ROW:62, TOP:176};
const readyImgs = new Map(), pendingImgs = new Set();
let fontsReady=null;
function ensureFonts(){
  return fontsReady ||= Promise.all(["900 58px Heebo","800 40px Heebo","600 32px Heebo","500 30px Heebo"].map(f=>document.fonts.load(f))).catch(()=>{});
}
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
function setFont(ctx,w,s){ ctx.font=`${w} ${s}px Heebo, Arial, sans-serif`; }
function fitText(ctx,text,maxW,size,weight){ let s=size; setFont(ctx,weight,s); while(ctx.measureText(text).width>maxW && s>16){ s-=2; setFont(ctx,weight,s); } }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function imgGroups(opt){ const k=opt.teams.length, per=k<=4?k:Math.ceil(k/2), g=[]; for(let i=0;i<k;i+=per) g.push(opt.teams.slice(i,i+per).map((t,j)=>({t,idx:i+j}))); return {per,groups:g}; }
function groupH(g){ return IMG.HEAD + Math.max(1,...g.map(c=>c.t.players.length+(c.t.subs||[]).length))*IMG.ROW + 8; }
function sectionH(sec){ const L=imgGroups(sec.opt); return (sec.label?74:0) + L.groups.reduce((a,g)=>a+groupH(g)+IMG.GAP,0); }
function drawCol(ctx,t,idx,x,y,w,h,gk,c){
  const light=lum(c.c)>0.62;
  ctx.save(); rrect(ctx,x,y,w,h,22); ctx.fillStyle="#fff"; ctx.fill(); ctx.clip();
  ctx.fillStyle=c.c; ctx.fillRect(x,y,w,IMG.HEAD);
  if(c.c==="#ffffff"){ ctx.fillStyle="#e3e8e1"; ctx.fillRect(x,y+IMG.HEAD-3,w,3); }
  ctx.fillStyle=light?"#14201a":"#fff"; ctx.textAlign="center";
  fitText(ctx,c.n,w-20,42,800); ctx.fillText(c.n,x+w/2,y+IMG.HEAD/2+2);
  let ry=y+IMG.HEAD;
  const rows=t.players.map(p=>({p,sub:false})).concat((t.subs||[]).map(p=>({p,sub:true})));
  rows.forEach((r,i)=>{
    ctx.fillStyle=r.sub?"#fff3dc":(i%2?"#f4f7f2":"#fff"); ctx.fillRect(x,ry,w,IMG.ROW);
    ctx.fillStyle=r.sub?"#7a5212":"#14201a";
    const txt=(r.sub?"🔄 ":"")+r.p+(gk.has(norm(r.p))?" 🧤":"");
    fitText(ctx,txt,w-24,32,r.sub?500:600); ctx.fillText(txt,x+w/2,ry+IMG.ROW/2+2);
    ry+=IMG.ROW;
  });
  ctx.restore();
  ctx.strokeStyle="#dfe5dc"; ctx.lineWidth=2; rrect(ctx,x+1,y+1,w-2,h-2,22); ctx.stroke();
}
function buildCanvas(title, sections){
  const {W,PAD,GAP,TOP}=IMG;
  const hasSubs=sections.some(s=>s.opt.teams.some(t=>(t.subs||[]).length));
  const hasGK=sections.some(s=>(s.opt.gks||[]).length);
  const legend=[hasSubs&&"🔄 = מחליף", hasGK&&"🧤 = שוער"].filter(Boolean).join("   ");
  const H=TOP+sections.reduce((a,s)=>a+sectionH(s),0)+(legend?110:70);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d"); ctx.direction="rtl"; ctx.textBaseline="middle";
  ctx.fillStyle="#f2f4ef"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0e3b25"; ctx.fillRect(0,0,W,TOP-34);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; setFont(ctx,900,58); ctx.fillText(title,W/2,62);
  const sub=gameLine() || new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
  ctx.fillStyle="rgba(255,255,255,.78)"; fitText(ctx,sub,W-80,30,500); ctx.fillText(sub,W/2,112);
  let y=TOP;
  for(const sec of sections){
    if(sec.label){ ctx.textAlign="right"; ctx.fillStyle="#14201a"; setFont(ctx,800,46); ctx.fillText(sec.label,W-PAD,y+30); y+=74; }
    const L=imgGroups(sec.opt), n=L.per, colW=(W-2*PAD-(n-1)*GAP)/n, gk=gkSet(sec.opt);
    for(const g of L.groups){ const gh=groupH(g); g.forEach((c,j)=>drawCol(ctx,c.t,c.idx,W-PAD-(j+1)*colW-j*GAP,y,colW,gh,gk,optColor(sec.opt,c.idx))); y+=gh+GAP; }
  }
  ctx.textAlign="center"; ctx.fillStyle="#6b776f"; setFont(ctx,500,26);
  if(legend) ctx.fillText(legend,W/2,H-80);
  ctx.fillText("⚽ כדורגל שבועי",W/2,H-38);
  return cv;
}
function imgSpec(kind){

  if(kind==="vote") return {title:"🗳️ הצבעה על הכוחות", sections:T.options.map((o,i)=>({label:OPT_NAMES[i],opt:o}))};
  const i=+kind.slice(3); return {title:`⚽ ${OPT_NAMES[i]}`, sections:[{opt:T.options[i]}]};
}
function imgKey(kind,spec){ return kind+"|"+JSON.stringify(spec.sections)+"|"+colorSlots(8).join(",")+"|"+gameLine(); }
function prepareImg(key,spec){
  if(readyImgs.has(key)||pendingImgs.has(key)) return;
  pendingImgs.add(key);
  (async()=>{
    await ensureFonts();

    pendingImgs.delete(key); render();

}

// ---------- push notifications ----------
let messaging=null;
async function initPush(){
  if(!VAPID_KEY){ S.pushState="off"; return; }
  try{
    if(!("serviceWorker" in navigator) || !("Notification" in window) || !(await isSupported())){ S.pushState = (isIOS() && !isStandalone()) ? "ios-browser" : "unsupported"; render(); return; }
    messaging=getMessaging(app);
    onMessage(messaging, p=>{ const n=p.notification||{}; toast(`${n.title||""} ${n.body||""}`); });
    S.pushState = Notification.permission==="granted" ? (lsGet("pushOn")?"on":"ask") : Notification.permission==="denied" ? "denied" : "ask";
    if(Notification.permission==="granted") refreshToken(false);
  }catch(e){ console.warn("push",e); S.pushState="unsupported"; }
  render();
}
async function refreshToken(interactive){
  try{
    const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js",{scope:"./"});
    const token=await getToken(messaging,{vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if(!token) throw new Error("no token");
    if(S.uid && token!==lsGet("pushToken:"+S.uid)){ await setDoc(doc(db,"tokens",S.uid),{token, at:serverTimestamp()}); lsSet("pushToken:"+S.uid, token); }
    lsSet("pushOn","1"); S.pushState="on"; render();
    if(interactive) toast("🔔 התראות הופעלו! נודיע לך כשיתפנה מקום");
  }catch(e){ console.warn("token",e); if(interactive) toast("לא הצלחתי להפעיל התראות"); }
}
async function enablePush(){
  if(!messaging) return;
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){ S.pushState="denied"; render(); toast("ההתראות נחסמו. אפשר להפעיל אותן בהגדרות הדפדפן"); return; }
  await refreshToken(true);
}
function pushBox(){
  const st=S.pushState;
  if(st==="off"||st==="unsupported"||st==="unknown") return null;
  if(st==="on") return h("div",{class:"pushon"},"🔔 התראות פעילות");
  if(st==="ios-browser") return h("div",{class:"pushask"},"🔔 רוצה התראות כשההרשמה נפתחת, כשמתפנה מקום וכשהכוחות מתפרסמים? באייפון צריך קודם להוסיף את האפליקציה למסך הבית ולפתוח אותה משם.");
  if(st==="denied") return h("div",{class:"pushask"},"🔕 ההתראות חסומות. אפשר להפעיל אותן בהגדרות הדפדפן עבור האתר הזה.");
  return h("div",null,
    h("button",{class:"btn ghost full pushbtn",onclick:enablePush},"🔔 הפעל התראות"),
    h("div",{class:"pushask",style:"margin-top:4px;text-align:center"},"נודיע לך כשההרשמה נפתחת, כשמתפנה לך מקום וכשהכוחות מתפרסמים"));
}

    h("div",{class:"card"},
      names.length ? h("div",null,names.map(n=>{
        const r=rosterOf(n), val=r?r.r:0, gk=!!(r&&r.gk);
        const su=S.signups.find(s=>norm(s.name)===norm(n)), selfPh=su&&su.uid&&su.uid!=="admin"?S.phones[su.uid]:"", ph=(r&&r.phone)||selfPh;
        const row=h("div",{class:"prow"},
          h("div",{class:"nm click",onclick:()=>{ S.editPhone=S.editPhone===n?null:n; render(); }},h("b",null,n),h("small",{class:"unr"}, (r?`דירוג ${val}`:"לא דורג")+(gk?" · שוער":"")+(ph?" · 📱":""))),
          h("button",{class:"ic gk"+(gk?" on":""),title:"שוער",onclick:()=>toggleGK(n)},"🧤"),
          h("div",{class:"stars"},Array.from({length:RATING_MAX},(_,k)=>k+1).map(i=>h("button",{class:i<=val?"on":"","aria-label":String(i),onclick:()=>setRating(n,i)},"★"))),
          r?h("button",{class:"ic x",title:"הסר מהקבועים",onclick:()=>removeFromRoster(n)},"×"):h("span",{style:"width:28px"}));
        if(S.editPhone!==n) return row;
        const pin=h("input",{id:"ph_"+n,type:"tel",dir:"ltr",inputmode:"tel",placeholder:"050-0000000",value:S.draft["ph:"+n] ?? prettyPhone((r&&r.phone)||""),oninput:e=>{S.draft["ph:"+n]=e.target.value;}});
        return h("div",null,row,h("div",{class:"phedit"},
          selfPh ? h("div",{class:"hint"},`📱 ${n} מסר בהרשמה: ${prettyPhone(selfPh)}`) : null,
          h("div",{class:"hint"},"טלפון לשליחת וואטסאפ ישיר (רק אתה רואה):"),
          h("div",{class:"addrow"},pin,h("button",{class:"btn",onclick:()=>{ setRosterPhone(n,pin.value); delete S.draft["ph:"+n]; S.editPhone=null; }},"שמור"))));
      })) : h("div",{class:"empty"},"אין עדיין שחקנים.")),
    h("div",{class:"card"},
      h("h2",null,"🚫 לא ביחד"),
      h("div",{class:"hint"},"זוגות שהחלוקה תשים בקבוצות שונות."),
      names.length>1 ? h("div",{class:"aprow"}, sel("apA"), h("span",null,"⟷"), sel("apB"),
        h("button",{class:"btn",onclick:()=>addApart(S.draft.apA,S.draft.apB)},"הוסף")) : h("div",{class:"hint"},"צריך לפחות שני שחקנים."),
      S.apart.length ? h("div",{style:"margin-top:8px"},S.apart.map((p,i)=>h("div",{class:"prow"},
        h("div",{class:"nm"},h("b",null,`${p.a} ⟷ ${p.b}`)),
        h("button",{class:"ic x",title:"הסר",onclick:()=>removeApart(i)},"×")))) : null),
    h("div",{class:"card"},
      h("h2",null,"⏰ ביטולים מאוחרים"),
      h("div",{class:"hint"},"כשאתה מסיר שחקן בזמן חסימת הביטול, זה נרשם כאן אוטומטית."),
      lateCount.size ? [...lateCount.values()].sort((a,b)=>b.c-a.c).map(o=>h("div",{class:"prow"},
        h("div",{class:"nm"},h("b",null,o.n),h("small",{class:"unr"},`${o.c} ביטולים · אחרון ${fmtDate(o.last)}`)),
        h("button",{class:"ic x",title:"אפס",onclick:()=>removeLate(o.n)},"×"))) : h("div",{class:"empty"},"אין ביטולים מאוחרים 👍"))
  ];
}

const toLocalInput=ms=>{ const t=new Date(ms-new Date(ms).getTimezoneOffset()*60000); return t.toISOString().slice(0,16); };
function viewSettings(){
  const c=S.cfg, k=c.numTeams, cap=c.capacity, per=[...new Set(sizesFor(cap,k))].sort((a,b)=>b-a).join(" / ");
  const g=game(), d=S.draft;
  const field=(key,label,cur,attrs={})=>h("label",{class:"field"},h("span",null,label),
    h("input",{id:"f_"+key,type:attrs.type||"text",value:d[key]??cur??"",placeholder:attrs.ph||"",inputmode:attrs.im||null,dir:attrs.dir||null,oninput:e=>{d[key]=e.target.value;}}));
  const stepper=(lbl,sub,v,min,max,key)=>h("div",{class:"stepper"},
    h("div",{class:"lbl"},h("b",null,lbl),h("small",null,sub)),
    h("div",{class:"ctrl"},
      h("button",{onclick:()=>v>min&&setCfg({[key]:v-1})},"−"),
      h("output",null,v),
      h("button",{onclick:()=>v<max&&setCfg({[key]:v+1})},"+")));
  const open=isOpen(), future=c.openAt && c.openAt>Date.now();

  return [
    h("div",{class:"card"},
      h("h2",null,"🔓 הרשמה"),
      h("div",{class:"stepper"},
        h("div",{class:"lbl"},h("b",null,open?"ההרשמה פתוחה":"ההרשמה סגורה"),h("small",null,future?`תיפתח אוטומטית ${fmtFull(c.openAt)}`:open?"שחקנים יכולים להירשם עכשיו":"אף אחד לא יכול להירשם")),
        h("button",{class:"btn "+(open?"warn":""),onclick:()=>setCfg(open?{open:false,openAt:null}:{open:true,openAt:null})},open?"סגור הרשמה":"פתח עכשיו")),
      h("div",{class:"sub-h"},"⏰ פתיחה אוטומטית"),
      h("div",{class:"hint"},"ההרשמה תיפתח לבד בזמן שתבחר. כשלוחצים ״פתח רשימה חדשה״ היא מתוזמנת אוטומטית לאותה שעה בשבוע הבא."),
      h("div",{class:"addrow",style:"margin-top:8px"},
        h("input",{id:"f_openAt",type:"datetime-local",value:d.openAt ?? (future?toLocalInput(c.openAt):""),oninput:e=>{d.openAt=e.target.value;}}),
        h("button",{class:"btn",onclick:setAutoOpen},"קבע")),
      future ? h("button",{class:"linkbtn",onclick:()=>setCfg({openAt:null},"הפתיחה האוטומטית בוטלה")},"בטל פתיחה אוטומטית") : null),
    h("div",{class:"card"},
      h("h2",null,"📍 פרטי המשחק"),
      h("div",{class:"hint"},"יופיעו לכולם בראש הדף, עם כפתור ניווט."),
      field("gameAt","מועד המשחק הקרוב",c.gameAt?toLocalInput(c.gameAt):"",{type:"datetime-local"}),
      h("div",{class:"hint",style:"margin-top:4px"},"בלחיצה על ״פתח רשימה חדשה״ המועד עובר לשבוע הבא אוטומטית."),
      field("gPlace","מקום",g.place,{ph:"למשל: מגרש בית ספר אורט, חולון"}),
      h("div",{class:"sub-h"},"💳 תשלום"),
      field("price","מחיר לשחקן (₪), 0 = בלי מעקב תשלומים",c.price||"",{type:"number",im:"numeric",ph:"0"}),
      field("payLink","קישור לביט / פייבוקס, או מספר טלפון",c.payLink,{ph:"https://...",dir:"ltr"}),
      h("button",{class:"btn full",style:"margin-top:10px",onclick:saveDetails},"💾 שמור פרטים")),
    h("div",{class:"card"},
      h("h2",null,"🔒 ביטולים ואורחים"),
      h("div",{class:"hint"}, c.gameAt ? "כמה שעות לפני המשחק שחקנים כבר לא יכולים לבטל לבד?" : "כדי לחסום ביטולים, קבע קודם מועד משחק בכרטיס ״פרטי המשחק״."),
      h("div",{class:"chips"},[0,2,4,6,12,24].map(x=>h("button",{class:"chip"+((c.lockHours||0)===x?" on":""),onclick:()=>setCfg({lockHours:x})},x?`${x} שעות`:"בלי חסימה"))),
      h("div",{class:"stepper",style:"margin-top:8px"},
        h("div",{class:"lbl"},h("b",null,"אורחים (+1)"),h("small",null,c.allowGuests===false?"שחקנים לא יכולים להוסיף אורח":"כל שחקן רשום יכול להוסיף אורח אחד")),
        h("button",{class:"btn "+(c.allowGuests===false?"":"ghost"),onclick:()=>setCfg({allowGuests:c.allowGuests===false})},c.allowGuests===false?"אפשר":"בטל"))),
    h("div",{class:"card"},
      h("h2",null,"⚙️ הגדרות המשחק"),
      stepper("כמות שחקנים","מי שמעבר לזה נכנס להמתנה",cap,2,60,"capacity"),
      stepper("כמות קבוצות",`${per} שחקנים בקבוצה`,k,2,8,"numTeams"),
      h("div",{class:"chips"},[[18,3],[12,2],[15,3],[20,4]].map(([a,b])=>h("button",{class:"chip",onclick:()=>setCfg({capacity:a,numTeams:b})},`${a} · ${b} קבוצות`)))),
    h("div",{class:"card"},
      h("h2",null,"🗓️ שבוע חדש"),
      h("div",{class:"hint"},"מוחק את הנרשמים, הכוחות, ההצבעות והתשלומים. הדירוגים, הטבלה והפרטים נשמרים."),
      h("button",{class:"btn warn full",style:"margin-top:12px",onclick:()=>{
        if(!S.confirmReset){ S.confirmReset=true; render(); setTimeout(()=>{S.confirmReset=false;render();},4000); return; }
        S.confirmReset=false; S.tab="list"; newWeek(); render();
      }},S.confirmReset?"בטוח? לחץ שוב לאישור":"פתח רשימה חדשה"))
  ];
}

window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(t==="teams"||t==="stats"){ S.tab=t; render(); } });
render();

</script>
